# Production Android build → Google Play **Beta** track (open/closed testing named "beta" in Play Console).
# Requires a Play API–enabled service account JSON secret. Uses GitHub Environment `production`.
# Triggers: pushes to `master`, or manual run.

name: Android Release — Production (Play Beta)

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: android-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish-android-production:
    runs-on: ubuntu-latest
    container:
      image: reactnativecommunity/react-native-android
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Set CI version (Play requires increasing versionCode)
        run: |
          echo "CI_VERSION_CODE=$(date +%s)" >> "$GITHUB_ENV"
          echo "CI_VERSION_NAME=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build signed App Bundle (AAB)
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_FILE: release.keystore
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_MYAPP_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease -PCI_VERSION_CODE="$CI_VERSION_CODE" -PCI_VERSION_NAME="$CI_VERSION_NAME"

      - name: Upload AAB artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: saad-task-android-production-aab
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish to Google Play — Beta track
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          packageName: com.saadtask
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: beta
          status: completed
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
