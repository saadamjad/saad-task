# Fast checks on every PR / push to main-line branches — separate from release workflows
# (android-release-*.yml / ios-release-*.yml), which sign builds and publish to stores.
name: CI

on:
  pull_request:
  push:
    branches:
      - development
      - main
      - master

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test --watch=false
