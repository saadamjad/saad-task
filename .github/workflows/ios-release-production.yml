# Production iOS build → **TestFlight** (App Store Connect). Configure signing + API key per GitHub Environment `production`.
# Triggers: pushes to `master`, or manual run.

name: iOS Release — Production (TestFlight)

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: ios-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-production:
    runs-on: macos-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install Yarn
        run: npm install -g yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Decode signing certificate
        run: echo "${{ secrets.IOS_DISTRIBUTION_CERT_BASE64 }}" | base64 -d > ios_distribution.p12

      - name: Decode provisioning profile
        run: echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > app.mobileprovision

      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(grep -a -A1 UUID app.mobileprovision | grep -io "[-A-F0-9]\{36\}" | head -n 1)
          cp app.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/"${UUID}.mobileprovision"

      - name: Apply Team ID to ExportOptions.plist
        env:
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: sed -i '' "s/REPLACE_WITH_TEAM_ID/${IOS_TEAM_ID}/g" ios/ExportOptions.plist

      - name: Build and export signed IPA
        env:
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import ios_distribution.p12 -k build.keychain -P "$IOS_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" build.keychain
          mkdir -p ios/build
          xcodebuild -workspace ios/SaadTask.xcworkspace \
            -scheme SaadTask \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/build/SaadTask.xcarchive \
            archive
          xcodebuild -exportArchive \
            -archivePath ios/build/SaadTask.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath ios/build

      - name: Locate exported IPA
        id: ipa
        run: |
          path=$(ls ios/build/*.ipa | head -n 1)
          echo "file=$path" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: saad-task-ios-production
          path: ${{ steps.ipa.outputs.file }}

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v4
        with:
          app-path: ${{ steps.ipa.outputs.file }}
          app-type: ios
          issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_PRIVATE_KEY }}
          uses-non-exempt-encryption: 'false'
